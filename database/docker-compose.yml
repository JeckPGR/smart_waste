services:
  # =========================================================================
  # Service 1: Database PostgreSQL 16 (Self-Managed)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: smartwaste-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-smartwaste}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartwaste_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartwaste}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartwaste-net

  # =========================================================================
  # Service 2: pgAdmin 4 (Database Management Web GUI)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartwaste-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smartwaste.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - smartwaste_pgadmin_data:/var/lib/pgadmin
    networks:
      - smartwaste-net

networks:
  smartwaste-net:
    driver: bridge

volumes:
  smartwaste_pgdata:
    name: smartwaste_pgdata
  smartwaste_pgadmin_data:
    name: smartwaste_pgadmin_data
